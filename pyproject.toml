[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "pydantic>=2.14.1",
    "numpy",
    "accelerate"
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk"}

[tool.mypy]
explicit_package_bases = true
mypy_path = "typings"
exclude = ["^llm_sdk/", "^typings/", "^moulinette/"]

